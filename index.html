<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fiszki">
<meta name="theme-color" content="#c8102e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Fiszki · flashcards</title>
<style>
  :root {
    --bg: #f6f4ef; --fg: #1d1d1f; --muted: #6b6b70; --card: #ffffff;
    --accent: #c8102e; --line: #e4e1da; --back: #fff7f8; --go: #1f9d55; --warn: #d97706; --gold: #f5b301;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --fg: #f2f2f4; --muted: #9a9aa2; --card: #1f1f23; --line: #2e2e34; --back: #2a1d20; --accent: #ff4d5e; --go: #3ecf7e; --warn: #f59e0b; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100dvh; padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);
    user-select: none; -webkit-user-select: none;
  }
  [hidden] { display: none !important; }
  .view { height: 100%; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 10px; gap: 12px; min-height: 58px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 22px 0 10px; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* Language picker */
  .pick-title { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin: 26px 0 4px; }
  .pick-sub { color: var(--muted); margin: 0 0 22px; line-height: 1.5; }
  .packs { display: flex; flex-direction: column; gap: 12px; }
  .pack {
    display: flex; align-items: center; gap: 16px; text-align: left; width: 100%;
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px;
    box-shadow: 0 6px 20px rgba(0,0,0,.05); transition: transform .12s;
  }
  .pack:active { transform: scale(.98); }
  .pack.current { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .pack .flag { font-size: 44px; line-height: 1; }
  .pack b { display: block; font-size: 20px; }
  .pack small { display: block; color: var(--muted); font-size: 14px; }
  .pack .count { margin-left: auto; color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }

  .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; flex-wrap: wrap; }
  .seg button { flex: 1; border: 0; background: none; color: var(--muted); font-weight: 650; font-size: 15px; padding: 10px 6px; border-radius: 10px; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 8px; text-align: center; }
  .tile b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .tile small { color: var(--muted); font-size: 12px; }

  .list { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .list div { display: flex; justify-content: space-between; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 15px; }
  .list div:first-child { border-top: 0; }
  .list i { color: var(--muted); font-style: normal; text-align: right; }
  .list em { color: var(--warn); font-style: normal; font-weight: 700; margin-left: 6px; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 8px; }

  .scroll { flex: 1; overflow-y: auto; padding-bottom: 12px; -webkit-overflow-scrolling: touch; }
  .cta { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
  .big { border: 1px solid var(--line); background: var(--card); font-weight: 750; font-size: 18px; padding: 17px; border-radius: 18px; }
  .big.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Play view */
  .icon { border: 1px solid var(--line); background: var(--card); min-width: 40px; height: 40px; border-radius: 12px; font-size: 18px; padding: 0 8px; }
  .langbtn { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 650; color: var(--muted); }
  .langbtn span { font-size: 20px; }
  .counters { display: flex; gap: 8px; align-items: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chip { padding: 6px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 15px; }
  .chip.ok { color: var(--go); } .chip.sk { color: var(--warn); }
  .combo { color: var(--accent); font-weight: 800; transition: transform .2s; }
  .combo.pop { transform: scale(1.35); }
  .bar { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--go); width: 0; transition: width .25s; }
  .status { color: var(--muted); font-size: 13px; text-align: center; margin: 6px 0 10px; font-variant-numeric: tabular-nums; }
  .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .swiper { position: relative; touch-action: none; cursor: grab; will-change: transform; perspective: 1200px; }
  .swiper.anim { transition: transform .26s cubic-bezier(.2,.7,.2,1), opacity .26s; }
  .card { position: relative; width: 100%; min-height: 48vh; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2,.7,.2,1); }
  .card.instant { transition: none; }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.08);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 22px; text-align: center;
  }
  .face.back { transform: rotateY(180deg); background: var(--back); }
  .lang { position: absolute; top: 16px; left: 0; right: 0; font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
  .lvl { position: absolute; top: 14px; left: 16px; font-size: 11px; font-weight: 800; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
  .word { font-size: clamp(26px, 7.5vw, 42px); font-weight: 700; line-height: 1.2; word-break: break-word; }
  .pron { margin-top: 10px; color: var(--accent); font-size: 18px; font-weight: 500; letter-spacing: .02em; }
  .pron:empty, .note:empty, .retry:empty, .lvl:empty { display: none; }
  .note { margin-top: 14px; color: var(--muted); font-size: 15px; font-style: italic; }
  .hint { position: absolute; bottom: 16px; color: var(--muted); font-size: 13px; }
  .retry { position: absolute; top: 14px; right: 16px; font-size: 12px; font-weight: 700; color: var(--warn); }
  .stamp {
    position: absolute; z-index: 5; pointer-events: none; opacity: 0; font-weight: 800; font-size: 24px; letter-spacing: .06em;
    padding: 4px 12px; border: 4px solid; border-radius: 10px; background: color-mix(in srgb, var(--card) 75%, transparent); white-space: nowrap;
  }
  .stamp.got { top: 44px; left: 20px; color: var(--go); transform: rotate(-14deg); }
  .stamp.undo { top: 44px; right: 20px; color: var(--muted); transform: rotate(14deg); }
  .stamp.skip { bottom: 50px; left: 50%; color: var(--warn); transform: translateX(-50%); }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .actions button { flex: 1; font-weight: 750; font-size: 16px; padding: 15px 6px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); }
  .actions .ok { background: var(--go); border-color: var(--go); color: #fff; flex: 1.3; }
  .actions .sk { color: var(--warn); }
  .actions button:disabled { opacity: .4; }
  .tip { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }

  /* Summary */
  .stars { text-align: center; font-size: 52px; letter-spacing: 6px; margin: 10px 0 0; }
  .stars .off { color: var(--line); }
  .stars .on { color: var(--gold); display: inline-block; animation: pop .5s backwards; }
  .stars .on:nth-child(2) { animation-delay: .15s; } .stars .on:nth-child(3) { animation-delay: .3s; }
  @keyframes pop { from { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.3); } }
  .score { text-align: center; font-size: 46px; font-weight: 800; margin: 4px 0 0; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 6px; }
  .badge { display: block; width: fit-content; margin: 8px auto 0; background: var(--gold); color: #3a2a00; font-weight: 800; font-size: 13px; padding: 5px 12px; border-radius: 999px; }
</style>
</head>
<body>

<!-- LANGUAGE PICKER -->
<section class="view" id="vPick" hidden>
  <div class="scroll">
    <div class="pick-title">Fiszki ✨</div>
    <p class="pick-sub">What do you want to learn?<br>Czego chcesz się uczyć?</p>
    <div class="packs" id="packs"></div>
  </div>
</section>

<!-- HOME -->
<section class="view" id="vStart" hidden>
  <header>
    <h1 id="homeTitle"></h1>
    <button class="icon langbtn" id="langBtn"><span id="langFlag"></span><b data-t="switchLang"></b></button>
  </header>
  <div class="scroll">
    <div class="tiles">
      <div class="tile"><b id="sStreak">0</b><small data-t="dayStreak"></small></div>
      <div class="tile"><b id="sSession">0</b><small data-t="thisSession"></small></div>
      <div class="tile"><b id="sBest">–</b><small data-t="bestRound"></small></div>
    </div>
    <div id="levelBox" hidden>
      <h2 data-t="level"></h2>
      <div class="seg" id="levelSeg"></div>
    </div>
    <h2 data-t="direction"></h2>
    <div class="seg" id="modeSeg"></div>
    <h2 data-t="perRound"></h2>
    <div class="seg" id="sizeSeg"></div>
    <h2 data-t="trouble"></h2>
    <div id="trouble"></div>
  </div>
  <div class="cta">
    <button class="big primary" id="startBtn"></button>
    <button class="big" id="resumeBtn" hidden></button>
  </div>
</section>

<!-- PLAY -->
<section class="view" id="vPlay" hidden>
  <header>
    <button class="icon" id="homeBtn" aria-label="Home">✕</button>
    <div class="counters">
      <span class="combo" id="combo"></span>
      <span class="chip ok" id="cGot">✓ 0</span>
      <span class="chip sk" id="cSkip">↑ 0</span>
    </div>
  </header>
  <div class="bar"><i id="bar"></i></div>
  <div class="status" id="status"></div>
  <div class="stage">
    <div class="swiper" id="swiper">
      <div class="stamp got" data-t="stGot"></div>
      <div class="stamp undo" data-t="stUndo"></div>
      <div class="stamp skip" data-t="stSkip"></div>
      <div class="card" id="card" role="button" tabindex="0">
        <div class="face front">
          <div class="lvl" id="lvl"></div>
          <div class="retry" id="retry"></div>
          <div class="lang" id="fLang"></div><div class="word" id="fWord"></div><div class="pron" id="fPron"></div>
          <div class="hint" data-t="tap"></div>
        </div>
        <div class="face back">
          <div class="lang" id="bLang"></div><div class="word" id="bWord"></div><div class="pron" id="bPron"></div><div class="note" id="bNote"></div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button id="undoBtn" data-t="undo"></button>
      <button id="skipBtn" class="sk" data-t="skip"></button>
      <button id="gotBtn" class="ok" data-t="got"></button>
    </div>
    <div class="tip" data-t="tip"></div>
  </div>
</section>

<!-- SUMMARY -->
<section class="view" id="vSum" hidden>
  <div class="scroll">
    <div class="stars" id="stars"></div>
    <div class="score" id="score"></div>
    <p class="sub" id="scoreSub"></p>
    <span class="badge" id="badge" hidden></span>
    <h2 data-t="roundStats"></h2>
    <div class="tiles">
      <div class="tile"><b id="rGot">0</b><small data-t="firstTry"></small></div>
      <div class="tile"><b id="rSkip">0</b><small data-t="notYet"></small></div>
      <div class="tile"><b id="rCombo">0</b><small data-t="bestCombo"></small></div>
    </div>
    <h2 id="reviewTitle"></h2>
    <div id="review"></div>
  </div>
  <div class="cta">
    <button class="big primary" id="againBtn" data-t="playAgain"></button>
    <button class="big" id="sumHomeBtn" data-t="home"></button>
  </div>
</section>

<script>
(() => {
  const SESSION_GAP = 30 * 60 * 1000;   // a new session starts after 30 min of inactivity
  const SIZES = [10, 20, 30, 50];
  const $ = id => document.getElementById(id);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const swiper = $('swiper'), card = $('card');

  // ---------- interface languages ----------
  const plN = (n, one, few, many) => n === 1 ? one : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? few : many;
  const I18N = {
    en: {
      lang: { pl: 'Polish', en: 'English', it: 'Italian' },
      switchLang: 'Language', dayStreak: '🔥 day streak', thisSession: '✓ this session', bestRound: '🏆 best round',
      level: 'Level', direction: 'Direction', perRound: 'Cards per round', trouble: 'Your trouble words', all: 'All', mix: 'Mix',
      troubleEmpty: 'None yet. Words you mark "not yet" show up here until you know them first try.',
      start: n => `Start round · ${n} cards`, resume: n => `Resume round · ${n} left`,
      tap: 'tap to reveal', again: '↻ again', progress: (d, t, l) => `${d} / ${t} learned · ${l} left`,
      undo: '↶ Undo', skip: '↑ Not yet', got: '✓ Got it', tip: 'Swipe → got it · ↑ not yet · ← undo · tap to flip',
      stGot: 'GOT IT', stSkip: 'NOT YET', stUndo: 'UNDO',
      firstTryOf: (a, t) => `${a} of ${t} right first try`, roundStats: 'Round stats',
      firstTry: '✓ first try', notYet: '↑ not yet', bestCombo: '🔥 best combo',
      review: 'Review these', flawless: 'Flawless round', flawlessMsg: 'Every card right on the first try. 🎉',
      newBest: '🏆 New personal best!', fixed: n => `💪 Fixed ${n} trouble word${n > 1 ? 's' : ''}`,
      playAgain: 'Play again', home: 'Home', words: n => `${n} words`,
    },
    pl: {
      lang: { pl: 'Polski', en: 'Angielski', it: 'Włoski' },
      switchLang: 'Język', dayStreak: '🔥 dni z rzędu', thisSession: '✓ w tej sesji', bestRound: '🏆 najlepsza runda',
      level: 'Poziom', direction: 'Kierunek', perRound: 'Fiszek w rundzie', trouble: 'Twoje trudne słowa', all: 'Wszystkie', mix: 'Mix',
      troubleEmpty: 'Na razie pusto. Słowa oznaczone „jeszcze nie” pojawią się tutaj, dopóki nie odgadniesz ich za pierwszym razem.',
      start: n => `Zacznij rundę · ${n} ${plN(n, 'fiszka', 'fiszki', 'fiszek')}`, resume: n => `Wznów rundę · zostało ${n}`,
      tap: 'dotknij, aby odkryć', again: '↻ jeszcze raz', progress: (d, t, l) => `${d} / ${t} opanowane · zostało ${l}`,
      undo: '↶ Cofnij', skip: '↑ Powtórz', got: '✓ Umiem', tip: 'Przesuń → umiem · ↑ jeszcze nie · ← cofnij · dotknij, by odwrócić',
      stGot: 'UMIEM', stSkip: 'JESZCZE NIE', stUndo: 'COFNIJ',
      firstTryOf: (a, t) => `${a} z ${t} za pierwszym razem`, roundStats: 'Statystyki rundy',
      firstTry: '✓ za 1. razem', notYet: '↑ jeszcze nie', bestCombo: '🔥 najlepsza seria',
      review: 'Do powtórki', flawless: 'Runda bez błędów', flawlessMsg: 'Wszystko za pierwszym razem. 🎉',
      newBest: '🏆 Nowy rekord!', fixed: n => `💪 Opanowane trudne słowa: ${n}`,
      playAgain: 'Jeszcze raz', home: 'Ekran główny', words: n => `${n} ${plN(n, 'słowo', 'słowa', 'słów')}`,
    },
  };

  // ---------- packs ----------
  let PACKS = [], P = null, T = I18N.en;
  let entries = [], cards = new Map(), levels = [], S, showingBack = false, busy = false;
  const tgt = e => e[P.target], bas = e => e[P.base];
  const storeKey = id => id === 'pl' ? 'fiszki.v2' : `fiszki.v2.${id}`;   // 'pl' keeps the original key
  const normalize = list => {
    const seen = new Set();   // de-duplicate by target-language word, first occurrence wins
    return list.filter(e => { const k = String(e[P.target]).toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
  };

  function openPack(pack) {
    P = pack; T = I18N[P.ui] || I18N.en;
    localStorage.setItem('fiszki.pack', P.id);
    document.documentElement.lang = P.ui;
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T[el.dataset.t]; });
    entries = normalize(P.entries);
    cards = new Map(entries.map(e => [tgt(e), e]));
    levels = [...new Set(entries.map(e => e.level).filter(Boolean))].sort();
    S = load();
    if (!['mix', P.target, P.base].includes(S.mode)) S.mode = 'mix';
    if (levels.length && ![...levels, 'all'].includes(S.level)) S.level = levels[0];
    reconcile(); save();
    S.screen = S.screen === 'pick' ? 'start' : S.screen;
    show();
  }

  function renderPicker() {
    $('vPick').hidden = false; ['vStart', 'vPlay', 'vSum'].forEach(id => $(id).hidden = true);
    const current = localStorage.getItem('fiszki.pack');
    $('packs').replaceChildren(...PACKS.map(p => {
      const b = document.createElement('button'); b.className = 'pack' + (p.id === current ? ' current' : '');
      const f = document.createElement('span'); f.className = 'flag'; f.textContent = p.flag;
      const txt = document.createElement('span');
      const name = document.createElement('b'); name.textContent = `${p.name} · ${p.title}`;
      const sub = document.createElement('small'); sub.textContent = p.subtitle;
      txt.append(name, sub);
      const c = document.createElement('span'); c.className = 'count'; c.textContent = (I18N[p.ui] || I18N.en).words(p.entries.length);
      b.append(f, txt, c);
      b.onclick = () => openPack(p);
      return b;
    }));
  }

  // ---------- state ----------
  const defaults = () => ({
    mode: 'mix', size: 20, level: null,
    cycle: [], cyclePos: 0,          // shuffle-bag over all cards: every card is drawn once per cycle
    round: null, screen: 'start', last: null,
    session: { last: 0, got: 0, skip: 0 },
    stats: { day: null, streak: 0, best: {} },
    trouble: {},                     // target word -> how often it was "not yet" (decreases when known first try)
  });
  function load() {
    try { return Object.assign(defaults(), JSON.parse(localStorage.getItem(storeKey(P.id))) || {}); } catch { return defaults(); }
  }
  const save = () => localStorage.setItem(storeKey(P.id), JSON.stringify(S));

  const dayStr = t => new Date(t).toLocaleDateString('en-CA');
  const sessionLive = () => Date.now() - S.session.last < SESSION_GAP;
  function touchSession() {
    if (!sessionLive()) S.session = { last: 0, got: 0, skip: 0 };
    S.session.last = Date.now();
    const today = dayStr(Date.now()), yesterday = dayStr(Date.now() - 864e5);
    if (S.stats.day !== today) { S.stats.streak = S.stats.day === yesterday ? S.stats.streak + 1 : 1; S.stats.day = today; }
  }
  const streakNow = () => [dayStr(Date.now()), dayStr(Date.now() - 864e5)].includes(S.stats.day) ? S.stats.streak : 0;

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  // Card key: "<language shown on the front>|<target-language word>"
  function keysForMode(mode) {
    const dirs = mode === 'mix' ? [P.target, P.base] : [mode];
    const pool = levels.length && S.level !== 'all' ? entries.filter(e => e.level === S.level) : entries;
    return pool.flatMap(e => dirs.map(d => `${d}|${tgt(e)}`));
  }
  const wordOf = key => key.slice(key.indexOf('|') + 1);
  const roundSize = () => { const n = keysForMode(S.mode).length; return S.size === 'all' ? n : Math.min(S.size, n); };
  const bestKey = () => `${levels.length ? S.level + ':' : ''}${roundSize()}`;

  // Keep the cycle and any running round valid when the vocabulary list changes; new cards are
  // slotted into the not-yet-drawn part of the cycle so they show up soon.
  function reconcile() {
    const valid = new Set(keysForMode(S.mode));
    const seen = S.cycle.slice(0, S.cyclePos).filter(k => valid.has(k));
    const rest = S.cycle.slice(S.cyclePos).filter(k => valid.has(k));
    const known = new Set([...seen, ...rest]);
    if (S.cycle.length) for (const k of valid) if (!known.has(k)) rest.splice(Math.floor(Math.random() * (rest.length + 1)), 0, k);
    S.cycle = [...seen, ...rest]; S.cyclePos = seen.length;
    if (S.round) {
      S.round.keys = S.round.keys.filter(k => cards.has(wordOf(k)));
      S.round.queue = S.round.queue.filter(k => cards.has(wordOf(k)));
      S.round.history = [];
      if (!S.round.queue.length) S.round = null;
    }
    if (S.screen === 'play' && !S.round) S.screen = 'start';
    if (S.screen === 'summary' && !S.last) S.screen = 'start';
  }

  function draw(n) {
    const all = keysForMode(S.mode), picked = new Set();
    let guard = all.length * 3;
    while (picked.size < n && guard--) {
      if (S.cyclePos >= S.cycle.length) { S.cycle = shuffle([...all]); S.cyclePos = 0; }
      picked.add(S.cycle[S.cyclePos++]);
    }
    return shuffle([...picked]);
  }

  function resetPool() { S.cycle = []; S.cyclePos = 0; S.round = null; save(); renderStart(); }

  function startRound() {
    const keys = draw(roundSize());
    S.round = {
      keys, queue: [...keys], misses: {}, firstTry: 0, got: 0, skips: 0, combo: 0, bestCombo: 0, history: [], best: bestKey(),
      troubleBefore: [...new Set(keys.map(wordOf).filter(w => S.trouble[w] > 0))],
    };
    S.screen = 'play'; save(); show();
  }

  function finishRound() {
    const r = S.round, total = r.keys.length;
    const acc = Math.round((r.firstTry / total) * 100);
    const bk = r.best || String(total);
    const prev = S.stats.best[bk];
    S.stats.best[bk] = Math.max(prev ?? 0, acc);
    const fixed = r.troubleBefore.filter(w => r.keys.some(k => wordOf(k) === w && !r.misses[k])).length;
    S.last = {
      total, acc, firstTry: r.firstTry, skips: r.skips, bestCombo: r.bestCombo, fixed,
      stars: acc >= 90 ? 3 : acc >= 70 ? 2 : acc >= 40 ? 1 : 0,
      newBest: prev !== undefined && acc > prev,
      review: Object.entries(r.misses).sort((a, b) => b[1] - a[1]),
    };
    S.round = null; S.screen = 'summary';
  }

  // ---------- rendering ----------
  function show() {
    $('vPick').hidden = true;
    $('vStart').hidden = S.screen !== 'start';
    $('vPlay').hidden = S.screen !== 'play';
    $('vSum').hidden = S.screen !== 'summary';
    if (S.screen === 'start') renderStart();
    if (S.screen === 'play') { setFlipped(false, true); resetSwiper(); renderPlay(); }
    if (S.screen === 'summary') renderSummary();
  }

  const fmtCard = (word, n) => {
    const e = cards.get(word), row = document.createElement('div');
    const left = document.createElement('span'); left.textContent = tgt(e);
    if (n) { const m = document.createElement('em'); m.textContent = `×${n}`; left.append(m); }
    const right = document.createElement('i'); right.textContent = bas(e);
    row.append(left, right); return row;
  };
  function segment(el, options, isActive, onPick) {
    el.replaceChildren(...options.map(([value, label]) => {
      const b = document.createElement('button');
      b.textContent = label; b.setAttribute('aria-pressed', isActive(value));
      b.onclick = () => onPick(value);
      return b;
    }));
  }

  function renderStart() {
    $('homeTitle').replaceChildren(document.createTextNode(`${P.title} `), Object.assign(document.createElement('span'), { textContent: P.flag }));
    $('langFlag').textContent = PACKS.length > 1 ? '🌍' : '';
    $('langBtn').hidden = PACKS.length < 2;
    $('sStreak').textContent = streakNow();
    $('sSession').textContent = sessionLive() ? S.session.got : 0;
    const best = S.stats.best[bestKey()];
    $('sBest').textContent = best === undefined ? '–' : best + '%';

    $('levelBox').hidden = !levels.length;
    if (levels.length) {
      const count = l => entries.filter(e => l === 'all' || e.level === l).length;
      segment($('levelSeg'), [...levels.map(l => [l, `${l} · ${count(l)}`]), ['all', T.all]], v => v === S.level,
        v => { if (v !== S.level) { S.level = v; resetPool(); } });
    }
    const code = c => c.toUpperCase();
    segment($('modeSeg'), [['mix', T.mix], [P.target, `${code(P.target)} → ${code(P.base)}`], [P.base, `${code(P.base)} → ${code(P.target)}`]],
      v => v === S.mode, v => { if (v !== S.mode) { S.mode = v; resetPool(); } });
    const total = keysForMode(S.mode).length;
    segment($('sizeSeg'), [...SIZES.filter(n => n < total).map(n => [n, String(n)]), ['all', `${T.all} (${total})`]],
      v => v === 'all' ? roundSize() === total : S.size === v, v => { S.size = v; save(); renderStart(); });

    const hard = Object.entries(S.trouble).filter(([w, n]) => n > 0 && cards.has(w)).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const box = $('trouble');
    if (hard.length) { const l = document.createElement('div'); l.className = 'list'; l.append(...hard.map(([w, n]) => fmtCard(w, n))); box.replaceChildren(l); }
    else { const p = document.createElement('div'); p.className = 'empty'; p.textContent = T.troubleEmpty; box.replaceChildren(p); }
    $('startBtn').textContent = T.start(roundSize());
    $('startBtn').disabled = !total;
    const rb = $('resumeBtn');
    rb.hidden = !S.round;
    if (S.round) rb.textContent = T.resume(S.round.queue.length);
  }

  function renderPlay() {
    const r = S.round, key = r.queue[0];
    const dir = key.slice(0, key.indexOf('|')), e = cards.get(wordOf(key));
    const targetFront = dir === P.target;
    $('fLang').textContent = T.lang[dir];
    $('bLang').textContent = T.lang[targetFront ? P.base : P.target];
    $('fWord').textContent = targetFront ? tgt(e) : bas(e);
    $('bWord').textContent = targetFront ? bas(e) : tgt(e);
    $('fPron').textContent = targetFront && e.pron ? `[ ${e.pron} ]` : '';
    $('bPron').textContent = !targetFront && e.pron ? `[ ${e.pron} ]` : '';
    $('bNote').textContent = e.note || '';
    $('lvl').textContent = e.level || '';
    $('retry').textContent = r.misses[key] ? T.again : '';
    const done = r.keys.length - r.queue.length;
    $('bar').style.width = `${(done / r.keys.length) * 100}%`;
    $('status').textContent = T.progress(done, r.keys.length, r.queue.length);
    $('cGot').textContent = `✓ ${S.session.got}`;
    $('cSkip').textContent = `↑ ${S.session.skip}`;
    $('combo').textContent = r.combo >= 3 ? `🔥${r.combo}` : '';
    $('undoBtn').disabled = !r.history.length;
  }

  function renderSummary() {
    const L = S.last;
    $('stars').replaceChildren(...[1, 2, 3].map(i => { const s = document.createElement('span'); s.className = i <= L.stars ? 'on' : 'off'; s.textContent = '★'; return s; }));
    $('score').textContent = `${L.acc}%`;
    $('scoreSub').textContent = T.firstTryOf(L.firstTry, L.total);
    const badge = L.newBest ? T.newBest : L.fixed ? T.fixed(L.fixed) : '';
    $('badge').hidden = !badge; $('badge').textContent = badge;
    $('rGot').textContent = L.firstTry; $('rSkip').textContent = L.skips; $('rCombo').textContent = L.bestCombo;
    const review = L.review.filter(([k]) => cards.has(wordOf(k)));
    $('reviewTitle').textContent = review.length ? T.review : T.flawless;
    const box = $('review');
    if (review.length) { const l = document.createElement('div'); l.className = 'list'; l.append(...review.map(([k, n]) => fmtCard(wordOf(k), n))); box.replaceChildren(l); }
    else { const p = document.createElement('div'); p.className = 'empty'; p.textContent = T.flawlessMsg; box.replaceChildren(p); }
  }

  // ---------- card motion ----------
  function setFlipped(v, instant) {
    showingBack = v;
    card.classList.toggle('instant', !!instant);
    card.classList.toggle('flipped', v);
    if (instant) { void card.offsetWidth; card.classList.remove('instant'); }
  }
  const flip = () => { if (!busy) setFlipped(!showingBack); };

  const stamp = cls => swiper.querySelector('.stamp.' + cls);
  function setDrag(dx, dy, animate) {
    swiper.classList.toggle('anim', !!animate);
    swiper.style.transform = dx || dy ? `translate(${dx}px, ${Math.min(dy, 0)}px) rotate(${dx * 0.05}deg)` : '';
    const horiz = Math.abs(dx) >= Math.abs(dy);
    stamp('got').style.opacity = horiz && dx > 0 ? Math.min(dx / 90, 1) : 0;
    stamp('undo').style.opacity = horiz && dx < 0 && S?.round?.history.length ? Math.min(-dx / 90, 1) : 0;
    stamp('skip').style.opacity = !horiz && dy < 0 ? Math.min(-dy / 90, 1) : 0;
  }
  function resetSwiper() { swiper.classList.remove('anim'); setDrag(0, 0); swiper.style.opacity = '1'; }
  const OUT = { got: () => `translate(${innerWidth * 1.3}px, 0) rotate(28deg)`, skip: () => `translate(0, -110vh) rotate(-4deg)` };

  async function flyOut(kind) {
    swiper.classList.add('anim');
    swiper.style.transform = OUT[kind]();
    swiper.style.opacity = '0';
    await wait(240);
  }
  function enter(from) {
    swiper.classList.remove('anim');
    setDrag(0, 0);
    swiper.style.transform = from;
    swiper.style.opacity = from.startsWith('scale') ? '0' : '1';
    void swiper.offsetWidth;
    swiper.classList.add('anim');
    swiper.style.transform = '';
    swiper.style.opacity = '1';
  }

  // ---------- grading ----------
  const snapshot = kind => JSON.stringify({ round: { ...S.round, history: undefined }, session: S.session, stats: S.stats, trouble: S.trouble, kind });

  async function grade(kind) {           // 'got' | 'skip'
    if (busy || S.screen !== 'play') return;
    busy = true;
    const r = S.round;
    r.history.push(snapshot(kind)); if (r.history.length > 30) r.history.shift();
    await flyOut(kind);
    touchSession();
    const key = r.queue.shift(), w = wordOf(key);
    if (kind === 'got') {
      r.got++; S.session.got++;
      if (!r.misses[key]) {
        r.firstTry++; r.combo++; r.bestCombo = Math.max(r.bestCombo, r.combo);
        if (S.trouble[w] > 0 && !--S.trouble[w]) delete S.trouble[w];
      }
    } else {
      r.skips++; S.session.skip++; r.combo = 0;
      r.misses[key] = (r.misses[key] || 0) + 1;
      S.trouble[w] = (S.trouble[w] || 0) + 1;
      // bring it back a few cards later (or right away if it is the only one left)
      r.queue.splice(Math.min(r.queue.length, 3 + Math.floor(Math.random() * 6)), 0, key);
    }
    if (!r.queue.length) { finishRound(); save(); busy = false; resetSwiper(); show(); return; }
    save();
    setFlipped(false, true); renderPlay(); enter('scale(.92)');
    if (kind === 'got' && r.combo >= 3) { $('combo').classList.add('pop'); setTimeout(() => $('combo').classList.remove('pop'), 200); }
    busy = false;
  }

  async function undo() {
    if (busy || S.screen !== 'play') return;
    const r = S.round;
    if (!r.history.length) { setDrag(0, 0, true); return; }
    busy = true;
    const snap = JSON.parse(r.history.pop()), history = r.history;
    S.round = { ...snap.round, history }; S.session = snap.session; S.stats = snap.stats; S.trouble = snap.trouble;
    save();
    setFlipped(false, true); renderPlay();
    enter(OUT[snap.kind]());              // the previous card comes back from where it was flung
    busy = false;
  }

  // ---------- input ----------
  let start = null, dx = 0, dy = 0, dragging = false;
  swiper.addEventListener('pointerdown', ev => {
    if (busy) return;
    start = { x: ev.clientX, y: ev.clientY }; dx = dy = 0; dragging = false;
    swiper.setPointerCapture(ev.pointerId);
  });
  swiper.addEventListener('pointermove', ev => {
    if (!start) return;
    dx = ev.clientX - start.x; dy = ev.clientY - start.y;
    if (!dragging && Math.hypot(dx, dy) > 8) dragging = true;
    if (dragging) setDrag(dx, dy);
  });
  swiper.addEventListener('pointerup', () => {
    if (!start) return;
    start = null;
    if (!dragging) return flip();
    if (-dy > 90 && -dy > Math.abs(dx)) grade('skip');
    else if (dx > 90) grade('got');
    else if (dx < -90) undo();
    else setDrag(0, 0, true);
  });
  swiper.addEventListener('pointercancel', () => { start = null; setDrag(0, 0, true); });

  const goHome = () => { S.screen = 'start'; save(); show(); };
  $('gotBtn').onclick = () => grade('got');
  $('skipBtn').onclick = () => grade('skip');
  $('undoBtn').onclick = undo;
  $('homeBtn').onclick = goHome;
  $('sumHomeBtn').onclick = goHome;
  $('startBtn').onclick = startRound;
  $('againBtn').onclick = startRound;
  $('resumeBtn').onclick = () => { S.screen = 'play'; save(); show(); };
  $('langBtn').onclick = renderPicker;
  document.addEventListener('keydown', ev => {
    if (!S || S.screen !== 'play' || !$('vPick').hidden) return;
    if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); flip(); }
    if (ev.key === 'ArrowRight') grade('got');
    if (ev.key === 'ArrowUp') { ev.preventDefault(); grade('skip'); }
    if (ev.key === 'ArrowLeft') undo();
  });

  // ---------- boot ----------
  localStorage.removeItem('fiszki.v1');
  fetch('packs.json', { cache: 'no-cache' })
    .then(r => r.json())
    .then(list => Promise.all(list.map(p => fetch(p.file, { cache: 'no-cache' }).then(r => r.json()).then(entries => ({ ...p, entries })))))
    .then(packs => {
      PACKS = packs;
      const saved = PACKS.find(p => p.id === localStorage.getItem('fiszki.pack'));
      if (saved) openPack(saved); else renderPicker();
    })
    .catch(() => { document.body.textContent = 'Could not load vocabulary.'; });
})();
</script>
</body>
</html>
